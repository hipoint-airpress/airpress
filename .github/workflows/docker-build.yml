  name: Docker Build and Push

  on:
    push:
      branches:
        - main
        - 'feat/**'
      tags:
        - 'v*'

    # 手动执行
    workflow_dispatch:

    # Pull Request 只构建，不推送
    pull_request:
      branches:
        - main


  jobs:
    build-and-push:
      runs-on: ubuntu-latest

      permissions:
        contents: read

      steps:
        # 1. 检出代码
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # 2. 设置 Docker Buildx
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # 3. 登录 Docker Hub
        # PR 不需要登录
        - name: Login to Docker Hub
          if: github.event_name != 'pull_request'
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        # 4. 提取 Docker 镜像元数据
        - name: Docker metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: h1dian/airpress
            tags: |
              # Git Tag
              # v1.2.3 -> 1.2.3
              type=semver,pattern={{version}}
              
              # 默认分支 main -> latest
              type=raw,value=latest,enable={{is_default_branch}}
              
              # 分支
              # main -> main
              # feat/login -> feat-login
              type=ref,event=branch
              
              # Git commit
              # git-abc1234
              type=sha,prefix=git-

        # 5. 构建 / 推送 Docker 镜像
        - name: Build and Push
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./scripts/Dockerfile

            # PR 只 Build，不 Push
            push: ${{ github.event_name != 'pull_request' }}

            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}

            build-args: |
              BUILD_COMMIT=${{ github.sha }}
              BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
              AIRPRESS_VERSION=${{ steps.meta.outputs.version }}
              SUBMODULE_UPDATE=${{ github.run_id }}

            # GitHub Actions Build Cache
            cache-from: type=gha
            cache-to: type=gha,mode=max
