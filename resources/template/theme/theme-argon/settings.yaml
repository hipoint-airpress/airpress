style:
  label: 全局样式
  items:
    page_layout:
      name: page_layout
      label: 页面布局
      type: select
      data-type: string
      default: 'double'
      options:
        - value: 'double'
          label: 双栏
        - value: 'single'
          label: 单栏
        - value: 'double-reverse'
          label: 双栏（反转）
    theme_color:
      name: theme_color
      label: 主题色
      type: text
      data-type: string
      default: '#5e72e4'
    disable_googlefont:
      name: disable_googlefont
      label: 禁用 Google Fonts
      type: radio
      data-type: bool
      default: true
      description: 国内网络建议开启
      options:
        - value: true
          label: 禁用
        - value: false
          label: 加载
    enable_into_article_animation:
      name: enable_into_article_animation
      label: 文章进入动画
      type: radio
      data-type: bool
      default: true
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
    immersion_color:
      name: immersion_color
      label: 沉浸式色彩（顶栏与 Banner 融合）
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
darkmode:
  label: 夜间模式
  items:
    darkmode_autoswitch:
      name: darkmode_autoswitch
      label: 夜间模式自动切换
      type: select
      data-type: string
      default: 'false'
      options:
        - value: 'false'
          label: 不自动切换
        - value: 'system'
          label: 跟随系统
        - value: 'time'
          label: 按时间（22:00-7:00）
        - value: 'alwayson'
          label: 始终开启
    amoled_dark:
      name: amoled_dark
      label: 默认开启暗黑模式（纯黑）
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
toolbar:
  label: 顶栏
  items:
    toolbar_title:
      name: toolbar_title
      label: 顶栏标题
      type: text
      data-type: string
      description: 留空则使用博客标题，填 --hidden-- 则隐藏
    toolbar_icon:
      name: toolbar_icon
      label: 顶栏图标
      type: attachment
      data-type: string
    toolbar_icon_link:
      name: toolbar_icon_link
      label: 顶栏图标链接
      type: text
      data-type: string
    toolbar_blur:
      name: toolbar_blur
      label: 顶栏毛玻璃
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
    show_toolbar_mask:
      name: show_toolbar_mask
      label: Banner 顶部渐变遮罩
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
banner:
  label: Banner
  items:
    banner_size:
      name: banner_size
      label: Banner 尺寸
      type: select
      data-type: string
      default: 'full'
      options:
        - value: 'full'
          label: 完整
        - value: 'mini'
          label: 迷你
        - value: 'hide'
          label: 隐藏
        - value: 'fullscreen'
          label: 全屏
    banner_title:
      name: banner_title
      label: Banner 标题
      type: text
      data-type: string
      description: 留空则使用博客标题
    banner_subtitle:
      name: banner_subtitle
      label: Banner 副标题
      type: text
      data-type: string
    banner_background_url:
      name: banner_background_url
      label: Banner 背景图
      type: attachment
      data-type: string
    banner_background_bing:
      name: banner_background_bing
      label: Banner 使用 Bing 每日一图
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 启用
        - value: false
          label: 禁用
    banner_background_color_type:
      name: banner_background_color_type
      label: Banner 背景颜色风格
      type: select
      data-type: string
      default: 'shape-primary'
      options:
        - value: 'shape-primary'
          label: 主题色
        - value: 'shape-default'
          label: 灰色
        - value: 'shape-gradient-primary'
          label: 渐变主题色
    banner_background_hide_shapes:
      name: banner_background_hide_shapes
      label: 隐藏 Banner 波浪形状
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 隐藏
        - value: false
          label: 显示
    page_background_url:
      name: page_background_url
      label: 页面背景图
      type: attachment
      data-type: string
    page_background_dark_url:
      name: page_background_dark_url
      label: 页面背景图（夜间）
      type: attachment
      data-type: string
    page_background_opacity:
      name: page_background_opacity
      label: 页面背景不透明度
      type: text
      data-type: string
      default: '1'
    page_background_banner_style:
      name: page_background_banner_style
      label: Banner 区域透明（配合页面背景图）
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 透明
        - value: false
          label: 默认
sidebar:
  label: 侧栏
  items:
    sidebar_announcement:
      name: sidebar_announcement
      label: 侧栏公告
      type: textarea
      data-type: string
    sidebar_banner_title:
      name: sidebar_banner_title
      label: 侧栏标题
      type: text
      data-type: string
      description: 留空则使用博客标题
    sidebar_banner_subtitle:
      name: sidebar_banner_subtitle
      label: 侧栏副标题
      type: text
      data-type: string
    sidebar_auther_image:
      name: sidebar_auther_image
      label: 侧栏作者头像
      type: attachment
      data-type: string
      description: 留空则使用用户头像
    sidebar_auther_name:
      name: sidebar_auther_name
      label: 侧栏作者名
      type: text
      data-type: string
      description: 留空则使用博客标题
    sidebar_author_description:
      name: sidebar_author_description
      label: 侧栏作者简介
      type: text
      data-type: string
article:
  label: 文章
  items:
    article_meta:
      name: article_meta
      label: 文章元信息
      type: text
      data-type: string
      default: 'time|views|comments|categories'
      description: 可选 time|edittime|views|comments|categories|author，用竖线分隔
    show_readingtime:
      name: show_readingtime
      label: 显示预计阅读时长
      type: radio
      data-type: bool
      default: true
      options:
        - value: true
          label: 显示
        - value: false
          label: 隐藏
    enable_lazyload:
      name: enable_lazyload
      label: 图片懒加载
      type: radio
      data-type: bool
      default: true
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
    donate_qrcode_url:
      name: donate_qrcode_url
      label: 赞赏二维码
      type: attachment
      data-type: string
    related_post_limit:
      name: related_post_limit
      label: 推荐文章数量
      type: text
      data-type: string
      default: '5'
      description: 按同分类推荐，填 0 关闭
feature:
  label: 功能
  items:
    enable_code_highlight:
      name: enable_code_highlight
      label: 代码高亮
      type: radio
      data-type: bool
      default: true
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
    code_theme:
      name: code_theme
      label: 代码高亮主题
      type: select
      data-type: string
      default: 'vs2015'
      options:
        - value: 'vs2015'
          label: VS2015（默认）
        - value: 'github'
          label: GitHub
        - value: 'github-dark'
          label: GitHub Dark
        - value: 'atom-one-dark'
          label: Atom One Dark
        - value: 'atom-one-light'
          label: Atom One Light
        - value: 'dracula'
          label: Dracula
        - value: 'monokai'
          label: Monokai
        - value: 'solarized-light'
          label: Solarized Light
        - value: 'solarized-dark'
          label: Solarized Dark
        - value: 'tomorrow-night'
          label: Tomorrow Night
        - value: 'tomorrow'
          label: Tomorrow
        - value: 'night-owl'
          label: Night Owl
        - value: 'nord'
          label: Nord
        - value: 'zenburn'
          label: Zenburn
        - value: 'xcode'
          label: Xcode
        - value: 'gruvbox-light'
          label: Gruvbox Light
        - value: 'gruvbox-dark'
          label: Gruvbox Dark
        - value: 'rainbow'
          label: Rainbow
    math_render:
      name: math_render
      label: 数学公式渲染
      type: select
      data-type: string
      default: 'disabled'
      options:
        - value: 'disabled'
          label: 关闭
        - value: 'mathjax3'
          label: MathJax 3
        - value: 'katex'
          label: KaTeX
    enable_pangu:
      name: enable_pangu
      label: 中英文自动空格
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 开启
        - value: false
          label: 关闭
    footer_html:
      name: footer_html
      label: 页脚附加 HTML
      type: textarea
      data-type: string
    hide_footer_author:
      name: hide_footer_author
      label: 隐藏页脚主题作者
      type: radio
      data-type: bool
      default: false
      options:
        - value: true
          label: 隐藏
        - value: false
          label: 显示
