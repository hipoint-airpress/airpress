      security:
      - AdminApiKey: []
      summary: 获取所有附件类型
      tags:
      - Admin.Attachment
  /admin/attachments/upload:
    post:
      consumes:
      - multipart/form-data
      description: 通过 multipart 表单上传单个文件,返回附件详情
      parameters:
      - description: 上传的文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseDTO'
