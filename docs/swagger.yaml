                data:
                  $ref: '#/definitions/dto.AttachmentDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 上传单个附件
      tags:
      - Admin.Attachment
  /admin/attachments/uploads:
    post:
      consumes:
      - multipart/form-data
      description: 通过 multipart 表单上传多个文件,返回附件详情列表
      parameters:
      - collectionFormat: csv
        description: 上传的文件列表
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseDTO'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AttachmentDTO'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 批量上传附件
      tags:
      - Admin.Attachment
