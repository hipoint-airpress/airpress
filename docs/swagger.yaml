host: localhost:8080
info:
  contact: {}
  description: |-
    AirPress 博客系统后端 API 文档,通过 swag 注释驱动自动生成。
    包含后台管理(/api/admin)与前台内容(/api/content)两组接口。
  title: AirPress API
  version: "1.0"
paths:
  /admin/airpress/logfile:
    get:
      description: 返回最近指定行数的日志文件内容
      parameters:
      - description: 返回的日志行数
        format: int64
        in: query
        name: lines
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseDTO'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 获取日志文件内容
      tags:
      - Admin.Auth
  /admin/attachments:
    delete:
      consumes:
      - application/json
      description: 根据附件ID列表批量删除附件
      parameters:
      - description: 附件ID列表
        in: body
        name: ids
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 批量删除附件
      tags:
      - Admin.Attachment
    get:
      consumes:
      - application/json
      description: 支持按关键词、媒体类型、附件类型过滤,支持排序与分页
      parameters:
      - description: 页码(从0开始)
        example: 0
        in: query
        name: page
        type: integer
      - description: 每页数量
        example: 10
        in: query
        name: size
        type: integer
      - collectionFormat: multi
        description: 排序字段,如 createTime,desc
        in: query
        items:
          type: string
        name: sort
        type: array
      - description: 名称关键词
        in: query
        name: keyword
        type: string
      - description: 媒体类型
        in: query
        name: mediaType
        type: string
      - description: 附件类型
        in: query
        name: attachmentType
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseDTO'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/dto.Page'
                  - properties:
                      content:
                        items:
                          $ref: '#/definitions/dto.AttachmentDTO'
                        type: array
                    type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 分页查询附件列表
      tags:
      - Admin.Attachment
  /admin/attachments/{id}:
    delete:
      description: 根据附件ID删除指定附件
      parameters:
      - description: 附件ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 删除附件
      tags:
      - Admin.Attachment
    get:
      description: 返回指定 ID 的附件详情
      parameters:
      - description: 附件ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseDTO'
            - properties:
                data:
                  $ref: '#/definitions/dto.AttachmentDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 根据ID获取附件
      tags:
      - Admin.Attachment
    put:
      consumes:
      - application/json
      description: 根据附件ID更新附件信息
      parameters:
      - description: 附件ID
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: 附件更新参数
        in: body
        name: attachmentUpdate
        required: true
        schema:
          $ref: '#/definitions/param.AttachmentUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseDTO'
            - properties:
                data:
                  $ref: '#/definitions/dto.AttachmentDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.BaseDTO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.BaseDTO'
      security:
      - AdminApiKey: []
      summary: 更新附件
      tags:
      - Admin.Attachment
  /admin/attachments/media_types:
    get:
      description: 返回附件库中所有出现过的媒体类型列表
      produces:
      - application/json
      responses:
        "200":
